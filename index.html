<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дашуля Tutor — Личный кабинет преподавателя</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>

  <style>
    /* Скрытие скроллбара */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased selection:bg-pink-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const LucideIcons = window.LucideReact || {};
    const {
      BookOpen = () => null, Calendar = () => null, CheckCircle2 = () => null,
      Clock = () => null, Plus = () => null, Search = () => null,
      Settings: SettingsIcon = () => null, Home = () => null, User = () => null,
      TrendingUp = () => null, AlertTriangle = () => null, Award = () => null,
      Sparkles = () => null, Image: ImageIcon = () => null, RotateCcw = () => null,
      Trash2 = () => null, Edit3 = () => null, ChevronRight = () => null,
      X = () => null, Upload = () => null, Check = () => null,
      Smartphone = () => null, Tablet = () => null, Monitor = () => null,
      Download = () => null, Share2 = () => null, Sliders = () => null,
      Database = () => null, History = () => null, CalendarBlank = () => null,
      CaretLeft = () => null, CaretRight = () => null, GearSix = () => null,
      Lock = () => null, Mail = () => null, Shield = () => null, LogOut = () => null
    } = LucideIcons;

    // ==========================================
    // 1. ТЕМЫ ОФОРМЛЕНИЯ (ВСЕ 17 ПРЕСЕТОВ)
    // ==========================================
    const THEMES = [
      { id: 'spring', name: 'Spring Blossom', category: 'Сезонные', bgGradient: 'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)', primary: '#ec4899', text: '#1f2937', cardBg: 'rgba(255, 255, 255, 0.55)', glassBorder: 'rgba(255, 255, 255, 0.6)', icon: '🌸' },
      { id: 'midnight', name: 'Midnight Glass', category: 'Минимализм', bgGradient: 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)', primary: '#38bdf8', text: '#f8fafc', cardBg: 'rgba(15, 23, 42, 0.6)', glassBorder: 'rgba(255, 255, 255, 0.12)', icon: '🌙' },
      { id: 'autumn', name: 'Autumn Amber', category: 'Сезонные', bgGradient: 'linear-gradient(135deg, #451a03 0%, #78350f 50%, #b45309 100%)', primary: '#f59e0b', text: '#fef3c7', cardBg: 'rgba(69, 26, 3, 0.55)', glassBorder: 'rgba(251, 191, 36, 0.3)', icon: '🍂' },
      { id: 'winter', name: 'Winter Frost', category: 'Сезонные', bgGradient: 'linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%)', primary: '#0284c7', text: '#0f172a', cardBg: 'rgba(255, 255, 255, 0.7)', glassBorder: 'rgba(255, 255, 255, 0.8)', icon: '❄️' },
      { id: 'halloween', name: 'Halloween Night', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #180828 0%, #2e0854 50%, #581c87 100%)', primary: '#f97316', text: '#faf5ff', cardBg: 'rgba(24, 8, 40, 0.65)', glassBorder: 'rgba(249, 115, 22, 0.4)', icon: '🎃' },
      { id: 'witch_night', name: 'Ведьминская ночь', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #050505 0%, #1a0033 50%, #330066 100%)', primary: '#c084fc', text: '#f3e8ff', cardBg: 'rgba(10, 0, 20, 0.7)', glassBorder: 'rgba(168, 85, 247, 0.4)', icon: '🔮' },
      { id: 'new_year', name: 'Новый год', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #064e3b 0%, #022c22 50%, #7f1d1d 100%)', primary: '#fbbf24', text: '#ecfdf5', cardBg: 'rgba(2, 44, 34, 0.65)', glassBorder: 'rgba(252, 211, 77, 0.4)', icon: '🎄' },
      { id: 'christmas', name: 'Рождество', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #991b1b 0%, #450a0a 100%)', primary: '#fef08a', text: '#fff1f2', cardBg: 'rgba(69, 10, 10, 0.6)', glassBorder: 'rgba(254, 240, 138, 0.5)', icon: '🎁' },
      { id: 'valentines', name: 'День Святого Валентина', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #be123c 0%, #881337 50%, #4c0519 100%)', primary: '#fb7185', text: '#fff1f2', cardBg: 'rgba(76, 5, 25, 0.65)', glassBorder: 'rgba(251, 113, 133, 0.5)', icon: '💖' },
      { id: 'birthday', name: 'День рождения', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #f43f5e 100%)', primary: '#fef08a', text: '#ffffff', cardBg: 'rgba(139, 92, 246, 0.45)', glassBorder: 'rgba(255, 255, 255, 0.5)', icon: '🎂' },
      { id: 'flower_garden', name: 'Цветочный сад', category: 'Природа', bgGradient: 'linear-gradient(135deg, #d9f99d 0%, #4ade80 50%, #059669 100%)', primary: '#047857', text: '#064e3b', cardBg: 'rgba(255, 255, 255, 0.55)', glassBorder: 'rgba(255, 255, 255, 0.7)', icon: '🌺' },
      { id: 'space', name: 'Космос', category: 'Минимализм', bgGradient: 'linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%)', primary: '#818cf8', text: '#f8fafc', cardBg: 'rgba(2, 6, 23, 0.75)', glassBorder: 'rgba(56, 189, 248, 0.3)', icon: '🚀' },
      { id: 'night_city', name: 'Ночной город', category: 'Минимализм', bgGradient: 'linear-gradient(135deg, #111827 0%, #1f2937 50%, #374151 100%)', primary: '#f59e0b', text: '#f9fafb', cardBg: 'rgba(17, 24, 39, 0.7)', glassBorder: 'rgba(245, 158, 11, 0.3)', icon: '🏙️' },
      { id: 'ocean', name: 'Морская тема', category: 'Природа', bgGradient: 'linear-gradient(135deg, #0f766e 0%, #0e7490 50%, #0369a1 100%)', primary: '#67e8f9', text: '#f0fdf4', cardBg: 'rgba(15, 118, 110, 0.5)', glassBorder: 'rgba(255, 255, 255, 0.4)', icon: '🌊' },
      { id: 'light_minimal', name: 'Светлый минимализм', category: 'Минимализм', bgGradient: 'linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)', primary: '#2563eb', text: '#0f172a', cardBg: 'rgba(255, 255, 255, 0.85)', glassBorder: 'rgba(203, 213, 225, 0.6)', icon: '☀️' },
      { id: 'gold_luxury', name: 'Графитово-золотая', category: 'Премиум', bgGradient: 'linear-gradient(135deg, #18181b 0%, #27272a 50%, #09090b 100%)', primary: '#eab308', text: '#fafafa', cardBg: 'rgba(24, 24, 27, 0.75)', glassBorder: 'rgba(234, 179, 8, 0.4)', icon: '👑' },
      { id: 'summer', name: 'Лето', category: 'Сезонные', bgGradient: 'linear-gradient(135deg, #fde047 0%, #f97316 100%)', primary: '#ea580c', text: '#431407', cardBg: 'rgba(255, 255, 255, 0.6)', glassBorder: 'rgba(255, 255, 255, 0.7)', icon: '☀️' }
    ];

    // ИНИЦИАЛЬНЫЕ ДАННЫЕ
    const INITIAL_STUDENTS = [
      {
        id: '1', name: 'Алина Захарова', language: 'English', totalLessons: 10, completedLessons: 8,
        startDate: '2026-10-12', endDate: '2026-11-12', price: 15000, duration: 60, color: '#ec4899',
        notes: 'Интермедиат уровень. Подготовка к собеседованию.',
        history: [
          { id: 'h1', date: '2026-10-14 11:00', note: 'Разбор Грамматики Present Perfect' },
          { id: 'h2', date: '2026-10-16 11:00', note: 'Практика говорения, тема Travel' },
          { id: 'h3', date: '2026-10-18 11:00', note: 'Аудирование и вокабуляр' }
        ]
      },
      {
        id: '2', name: 'Мухаммад Аль-Мансур', language: 'Arabic', totalLessons: 10, completedLessons: 5,
        startDate: '2026-10-01', endDate: '2026-11-01', price: 18000, duration: 90, color: '#38bdf8',
        notes: 'Диалект Египта + Письменность',
        history: [
          { id: 'h21', date: '2026-10-02 14:00', note: 'Алфавит и фонетика' },
          { id: 'h22', date: '2026-10-06 14:00', note: 'Базовые приветствия' }
        ]
      },
      {
        id: '3', name: 'Илья Мельников', language: 'English', totalLessons: 10, completedLessons: 9,
        startDate: '2026-09-20', endDate: '2026-10-20', price: 15000, duration: 60, color: '#a855f7',
        notes: 'IELTS Preparation (Academic)',
        history: [{ id: 'h31', date: '2026-09-21 16:00', note: 'Writing Task 1 Overview' }]
      },
      {
        id: '4', name: 'София Гусева', language: 'Arabic', totalLessons: 10, completedLessons: 2,
        startDate: '2026-10-15', endDate: '2026-11-15', price: 20000, duration: 60, color: '#22c55e',
        notes: 'Арабский для начинающих с нуля',
        history: [{ id: 'h41', date: '2026-10-17 18:00', note: 'Вводный урок и алфавит' }]
      }
    ];

    const INITIAL_LESSONS = [
      { id: 'l1', studentId: '1', date: '2026-10-28', time: '11:00', topic: 'Present Perfect', completed: false },
      { id: 'l2', studentId: '2', date: '2026-10-28', time: '14:00', topic: 'Алфавит', completed: false },
      { id: 'l3', studentId: '3', date: '2026-10-29', time: '16:00', topic: 'Speaking Part 2', completed: false }
    ];

    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    function getStudentStatus(student) {
      const remaining = student.totalLessons - student.completedLessons;
      const now = new Date();
      const endDate = new Date(student.endDate);
      if (remaining <= 0) return { label: 'Занятия закончились', color: 'bg-red-500/20 text-red-500 border-red-500/30' };
      if (endDate < now) return { label: 'Срок действия истёк', color: 'bg-red-500/20 text-red-400 border-red-500/30' };
      if (remaining === 1) return { label: 'Осталось 1 занятие!', color: 'bg-orange-500/20 text-orange-400 border-orange-500/30' };
      const diffDays = Math.ceil((endDate - now) / (1000 * 60 * 60 * 24));
      if (diffDays <= 3) return { label: 'Срок скоро истекает', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' };
      if (remaining <= 2) return { label: 'Мало занятий', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' };
      return { label: 'Активен', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' };
    }

    // ==========================================
    // 2. ГЛАВНЫЙ КОМПОНЕНТ ПРИЛОЖЕНИЯ
    // ==========================================
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('dashulya_auth') === 'true');
      const [students, setStudents] = useState(() => JSON.parse(localStorage.getItem('dashulya_students')) || INITIAL_STUDENTS);
      const [lessons, setLessons] = useState(() => JSON.parse(localStorage.getItem('dashulya_lessons')) || INITIAL_LESSONS);
      const [activeThemeId, setActiveThemeId] = useState(() => localStorage.getItem('dashulya_theme') || 'spring');
      const [customBg, setCustomBg] = useState(() => localStorage.getItem('dashulya_custom_bg') || null);
      const [bgBlur, setBgBlur] = useState(() => Number(localStorage.getItem('dashulya_bg_blur')) || 16);
      const [bgDim, setBgDim] = useState(() => Number(localStorage.getItem('dashulya_bg_dim')) || 10);
      const [borderRadius, setBorderRadius] = useState(() => Number(localStorage.getItem('dashulya_radius')) || 24);
      const [deviceMode, setDeviceMode] = useState(() => localStorage.getItem('dashulya_device') || 'auto');
      const [animationsEnabled, setAnimationsEnabled] = useState(() => localStorage.getItem('dashulya_anim') !== 'false');

      const [activeTab, setActiveTab] = useState('main'); // 'main' | 'calendar' | 'settings'

      // Модальные состояния
      const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      const [lessonModalStudent, setLessonModalStudent] = useState(null);
      const [historyStudent, setHistoryStudent] = useState(null);
      const [isPwaModalOpen, setIsPwaModalOpen] = useState(false);

      // Фильтры
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');

      useEffect(() => { localStorage.setItem('dashulya_students', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('dashulya_lessons', JSON.stringify(lessons)); }, [lessons]);
      useEffect(() => { localStorage.setItem('dashulya_theme', activeThemeId); }, [activeThemeId]);
      useEffect(() => {
        if (customBg) localStorage.setItem('dashulya_custom_bg', customBg);
        else localStorage.removeItem('dashulya_custom_bg');
      }, [customBg]);
      useEffect(() => {
        localStorage.setItem('dashulya_bg_blur', bgBlur);
        localStorage.setItem('dashulya_bg_dim', bgDim);
        localStorage.setItem('dashulya_radius', borderRadius);
        localStorage.setItem('dashulya_device', deviceMode);
        localStorage.setItem('dashulya_anim', animationsEnabled);
      }, [bgBlur, bgDim, borderRadius, deviceMode, animationsEnabled]);

      const currentTheme = useMemo(() => THEMES.find(t => t.id === activeThemeId) || THEMES[0], [activeThemeId]);

      const handleConfirmLesson = (studentId, date, note) => {
        setStudents(prev => prev.map(s => {
          if (s.id === studentId) {
            const completed = Math.min(s.totalLessons, s.completedLessons + 1);
            const newHistory = [{ id: Date.now().toString(), date, note: note || 'Занятие проведено' }, ...(s.history || [])];
            return { ...s, completedLessons: completed, history: newHistory };
          }
          return s;
        }));
        setLessonModalStudent(null);
      };

      const handleRevertLesson = (studentId, historyItemId) => {
        setStudents(prev => prev.map(s => {
          if (s.id === studentId) {
            const updatedHistory = (s.history || []).filter(h => h.id !== historyItemId);
            const completed = Math.max(0, s.completedLessons - 1);
            return { ...s, completedLessons: completed, history: updatedHistory };
          }
          return s;
        }));
      };

      const handleSaveStudent = (formData) => {
        if (editingStudent) {
          setStudents(prev => prev.map(s => s.id === editingStudent.id ? { ...s, ...formData } : s));
        } else {
          const newStudent = { id: Date.now().toString(), ...formData, completedLessons: 0, history: [] };
          setStudents(prev => [newStudent, ...prev]);
        }
        setIsStudentModalOpen(false);
        setEditingStudent(null);
      };

      const handleDeleteStudent = (id) => {
        if (window.confirm('Вы уверены, что хотите удалить этого ученика?')) {
          setStudents(prev => prev.filter(s => s.id !== id));
          if (historyStudent?.id === id) setHistoryStudent(null);
        }
      };

      const filteredStudents = useMemo(() => {
        return students.filter(s => {
          const matchesSearch = s.name.toLowerCase().includes(searchQuery.toLowerCase()) || (s.notes && s.notes.toLowerCase().includes(searchQuery.toLowerCase()));
          if (!matchesSearch) return false;
          const remaining = s.totalLessons - s.completedLessons;
          const isExpired = new Date(s.endDate) < new Date();

          if (statusFilter === 'active') return remaining > 0 && !isExpired;
          if (statusFilter === 'ending') return remaining > 0 && remaining <= 2;
          if (statusFilter === 'expired') return isExpired || remaining === 0;
          if (statusFilter === 'english') return s.language === 'English';
          if (statusFilter === 'arabic') return s.language === 'Arabic';
          return true;
        });
      }, [students, searchQuery, statusFilter]);

      const stats = useMemo(() => {
        const total = students.length;
        const active = students.filter(s => s.totalLessons - s.completedLessons > 0 && new Date(s.endDate) >= new Date()).length;
        const ending = students.filter(s => {
          const rem = s.totalLessons - s.completedLessons;
          return rem > 0 && rem <= 2;
        }).length;
        return { total, active, ending };
      }, [students]);

      if (!isAuthenticated) {
        return <AuthScreen onLogin={() => { localStorage.setItem('dashulya_auth', 'true'); setIsAuthenticated(true); }} />;
      }

      const getLayoutClass = () => {
        if (deviceMode === 'iphone') return 'max-w-[412px] mx-auto min-h-screen border-x border-white/10 shadow-2xl';
        if (deviceMode === 'ipad') return 'max-w-[900px] mx-auto min-h-screen border-x border-white/10 shadow-2xl';
        return 'w-full min-h-screen';
      };

      return (
        <div className="relative min-h-screen transition-colors duration-500 font-sans overflow-x-hidden" style={{ background: customBg ? 'none' : currentTheme.bgGradient, color: currentTheme.text }}>
          {customBg && <div className="fixed inset-0 bg-cover bg-center z-0 transition-all duration-300" style={{ backgroundImage: `url(${customBg})`, filter: `blur(${bgBlur}px)` }} />}
          <div className="fixed inset-0 pointer-events-none z-0 transition-opacity duration-300 bg-black" style={{ opacity: bgDim / 100 }} />

          <div className={`relative z-10 flex flex-col ${getLayoutClass()}`}>
            <MorningGreeting animationsEnabled={animationsEnabled} />

            <main className="flex-1 px-4 pt-2 pb-28 md:px-8">
              {activeTab === 'main' && (
                <DashboardView
                  students={filteredStudents} stats={stats} searchQuery={searchQuery} setSearchQuery={setSearchQuery}
                  statusFilter={statusFilter} setStatusFilter={setStatusFilter} currentTheme={currentTheme}
                  borderRadius={borderRadius} bgBlur={bgBlur}
                  onAddStudent={() => { setEditingStudent(null); setIsStudentModalOpen(true); }}
                  onEditStudent={(s) => { setEditingStudent(s); setIsStudentModalOpen(true); }}
                  onConfirmLesson={(s) => setLessonModalStudent(s)}
                  onViewHistory={(s) => setHistoryStudent(s)}
                  onOpenPwaGuide={() => setIsPwaModalOpen(true)}
                />
              )}

              {activeTab === 'calendar' && (
                <CalendarView
                  students={students} lessons={lessons}
                  onAddLesson={(newLesson) => setLessons(prev => [...prev, { ...newLesson, id: Date.now().toString() }])}
                  currentTheme={currentTheme} borderRadius={borderRadius} bgBlur={bgBlur}
                />
              )}

              {activeTab === 'settings' && (
                <SettingsView
                  currentTheme={currentTheme} setActiveThemeId={setActiveThemeId} customBg={customBg} setCustomBg={setCustomBg}
                  bgBlur={bgBlur} setBgBlur={setBgBlur} bgDim={bgDim} setBgDim={setBgDim}
                  borderRadius={borderRadius} setBorderRadius={setBorderRadius} deviceMode={deviceMode} setDeviceMode={setDeviceMode}
                  animationsEnabled={animationsEnabled} setAnimationsEnabled={setAnimationsEnabled}
                  students={students} setStudents={setStudents} onOpenPwaGuide={() => setIsPwaModalOpen(true)}
                  onLogout={() => { localStorage.removeItem('dashulya_auth'); setIsAuthenticated(false); }}
                />
              )}
            </main>

            <BottomNavigation activeTab={activeTab} setActiveTab={setActiveTab} currentTheme={currentTheme} borderRadius={borderRadius} bgBlur={bgBlur} />
          </div>

          {/* Модальные окна */}
          {isStudentModalOpen && (
            <StudentFormModal student={editingStudent} onClose={() => { setIsStudentModalOpen(false); setEditingStudent(null); }} onSave={handleSaveStudent} currentTheme={currentTheme} borderRadius={borderRadius} />
          )}
          {lessonModalStudent && (
            <LessonConfirmationModal student={lessonModalStudent} onClose={() => setLessonModalStudent(null)} onConfirm={(date, note) => handleConfirmLesson(lessonModalStudent.id, date, note)} currentTheme={currentTheme} borderRadius={borderRadius} />
          )}
          {historyStudent && (
            <StudentHistoryModal student={historyStudent} onClose={() => setHistoryStudent(null)} onRevertLesson={(hId) => handleRevertLesson(historyStudent.id, hId)} onDeleteStudent={() => handleDeleteStudent(historyStudent.id)} currentTheme={currentTheme} borderRadius={borderRadius} />
          )}
          {isPwaModalOpen && (
            <PwaInstallModal onClose={() => setIsPwaModalOpen(false)} currentTheme={currentTheme} borderRadius={borderRadius} />
          )}
        </div>
      );
    }

    // ==========================================
    // 3. ЭКРАН АВТОРИЗАЦИИ
    // ==========================================
    function AuthScreen({ onLogin }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (email && password) {
          onLogin();
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 text-slate-100 font-sans">
          <div className="w-full max-w-md p-8 rounded-3xl bg-white/10 backdrop-blur-2xl border border-white/20 shadow-2xl space-y-6 animate-fadeIn">
            <div className="text-center space-y-2">
              <div className="inline-flex p-3 rounded-2xl bg-pink-500/20 text-pink-400 border border-pink-500/30">
                <Sparkles className="w-8 h-8" />
              </div>
              <h1 className="text-2xl font-bold">Дашуля Tutor</h1>
              <p className="text-xs text-slate-400">Личный кабинет преподавателя</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div className="space-y-1">
                <label className="text-slate-300">Электронная почта</label>
                <div className="relative">
                  <Mail className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="tutor@example.com" className="w-full pl-10 pr-4 py-3 bg-black/30 rounded-xl border border-white/10 focus:outline-none focus:border-pink-500 text-white" />
                </div>
              </div>

              <div className="space-y-1">
                <label className="text-slate-300">Пароль</label>
                <div className="relative">
                  <Lock className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" className="w-full pl-10 pr-4 py-3 bg-black/30 rounded-xl border border-white/10 focus:outline-none focus:border-pink-500 text-white" />
                </div>
              </div>

    // ==========================================

    function MorningGreeting({ animationsEnabled }) {
      const [visible, setVisible] = useState(false);
      const [fadingOut, setFadingOut] = useState(false);

      useEffect(() => {
        const hours = new Date().getHours();
        if (hours >= 6 && hours < 11) {
          const todayStr = new Date().toDateString();
          if (localStorage.getItem('dashulya_greeting_date') !== todayStr) {
            setVisible(true);
            localStorage.setItem('dashulya_greeting_date', todayStr);
            setTimeout(() => {
              setFadingOut(true);
              setTimeout(() => setVisible(false), 1500);
            }, 8000);
          }
        }
      }, []);

      if (!visible) return null;

      return (
        <div className={`pt-6 pb-2 px-6 flex justify-center transition-all duration-1000 ${fadingOut ? 'opacity-0 -translate-y-4' : 'opacity-100 translate-y-0'}`}>
          <div className="px-6 py-3 rounded-full backdrop-blur-xl border border-white/20 shadow-xl flex items-center gap-3 bg-white/10">
            <span className="text-xl font-medium">Доброе утро, Дашуля</span>
            <span className={`text-xl text-pink-400 ${animationsEnabled ? 'animate-bounce' : ''}`}>❤️</span>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. КАЛЕНДАРЬ ЗАНЯТИЙ
    // ==========================================
    function CalendarView({ students, lessons, onAddLesson, currentTheme, borderRadius, bgBlur }) {
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [selectedDay, setSelectedDay] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      
      const [studentId, setStudentId] = useState(students[0]?.id || '');
      const [time, setTime] = useState('12:00');
      const [topic, setTopic] = useState('');

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const daysArray = [];
      for (let i = 1; i <= totalDays; i++) {
        daysArray.push(new Date(year, month, i));
      }

      const handleSaveLesson = (e) => {
        e.preventDefault();
        if (!selectedDay) return;
        const pad = n => String(n).padStart(2, '0');
        const dateStr = `${selectedDay.getFullYear()}-${pad(selectedDay.getMonth() + 1)}-${pad(selectedDay.getDate())}`;
        onAddLesson({ studentId, date: dateStr, time, topic, completed: false });
        setIsModalOpen(false);
        setTopic('');
      };

      return (
        <div className="space-y-4 pt-4">
          <div className="flex items-center justify-between bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20">
            <h2 className="text-lg font-bold capitalize">
              {currentMonth.toLocaleString('ru-RU', { month: 'long', year: 'numeric' })}
            </h2>
            <div className="flex gap-2">
              <button onClick={() => setCurrentMonth(new Date(year, month - 1, 1))} className="p-2 bg-white/10 rounded-xl hover:bg-white/20"><CaretLeft className="w-4 h-4" /></button>
              <button onClick={() => setCurrentMonth(new Date(year, month + 1, 1))} className="p-2 bg-white/10 rounded-xl hover:bg-white/20"><CaretRight className="w-4 h-4" /></button>
            </div>
          </div>

          <div className="grid grid-cols-7 gap-1 text-center text-xs font-semibold opacity-70">
            {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => <div key={d} className="py-1">{d}</div>)}
          </div>

          <div className="grid grid-cols-7 gap-1.5">
            {daysArray.map((day) => {
              const pad = n => String(n).padStart(2, '0');
              const dateStr = `${day.getFullYear()}-${pad(day.getMonth() + 1)}-${pad(day.getDate())}`;
              const dayLessons = lessons.filter(l => l.date === dateStr);

              return (
                <div key={dateStr} onClick={() => { setSelectedDay(day); setIsModalOpen(true); }} style={{ borderRadius: `${borderRadius - 6}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="min-h-[85px] p-1.5 border backdrop-blur-md hover:border-pink-500/50 transition-all cursor-pointer flex flex-col justify-between overflow-hidden">
                  <span className="text-xs font-medium opacity-80">{day.getDate()}</span>
                  <div className="space-y-1 overflow-y-auto max-h-[55px] no-scrollbar">
                    {dayLessons.map(lesson => {
                      const student = students.find(s => s.id === lesson.studentId);
                      return (
                        <div key={lesson.id} style={{ backgroundColor: student?.color || currentTheme.primary }} className="px-1.5 py-0.5 rounded text-[9px] font-medium text-white truncate shadow-sm">
                          {lesson.time} {student?.name || 'Ученик'}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>

          {isModalOpen && selectedDay && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="w-full max-w-sm border p-6 backdrop-blur-xl shadow-2xl space-y-4 text-xs">
                <h3 className="text-sm font-bold">Урок на {selectedDay.toLocaleDateString('ru-RU')}</h3>
                <form onSubmit={handleSaveLesson} className="space-y-3">
                  <div>
                    <label className="block mb-1 opacity-80">Ученик</label>
                    <select value={studentId} onChange={(e) => setStudentId(e.target.value)} className="w-full p-2.5 bg-black/40 rounded-xl border border-white/20 text-slate-100">
                      {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.language})</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block mb-1 opacity-80">Время</label>
                    <input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="w-full p-2.5 bg-black/40 rounded-xl border border-white/20 text-slate-100" />
                  </div>
                  <div>
                    <label className="block mb-1 opacity-80">Тема урока</label>
                    <input type="text" value={topic} onChange={(e) => setTopic(e.target.value)} placeholder="Например: Unit 4 Present Perfect" className="w-full p-2.5 bg-black/40 rounded-xl border border-white/20 text-slate-100" />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 py-2 bg-white/10 rounded-xl">Отмена</button>
                    <button type="submit" style={{ backgroundColor: currentTheme.primary }} className="flex-1 py-2 text-white rounded-xl font-semibold shadow-md">Добавить</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

        }

      const handleExport = () => {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(students, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute('href', dataStr);
        downloadAnchor.setAttribute('download', `tutor_backup_${new Date().toISOString().slice(0,10)}.json`);

        downloadAnchor.remove();

        const file = e.target.files[0];

                setStudents(imported);
                alert('Данные успешно импортированы!');

                <Download className="w-4 h-4" />Инструкция PWA
              </button>
              <button onClick={handleExport} style={{ borderRadius: `${borderRadius - 6}px` }} className="px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/20 text-xs font-medium flex items-center gap-2">
                <Download className="w-4 h-4" />Экспорт JSON
              </button>
              <label style={{ borderRadius: `${borderRadius - 6}px` }} className="px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/20 text-xs font-medium cursor-pointer flex items-center gap-2">
                <Upload className="w-4 h-4" />Импорт JSON
                <input type="file" onChange={handleImport} accept=".json" className="hidden" />
              </label>
            </div>

            <div className="pt-4 border-t border-white/10">
              <button onClick={onLogout} className="w-full py-2.5 bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 text-red-300 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all">
                <LogOut className="w-4 h-4" /> Выйти из кабинета
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. НИЖНЯЯ НАВИГАЦИЯ
    // ==========================================
    function BottomNavigation({ activeTab, setActiveTab, currentTheme, borderRadius, bgBlur }) {
      const tabs = [
        { id: 'main', label: 'Главная', icon: Home },
        { id: 'calendar', label: 'Календарь', icon: CalendarBlank },
        { id: 'settings', label: 'Настройки', icon: GearSix }
      ];

      return (
        <nav className="fixed bottom-3 left-1/2 -translate-x-1/2 z-40 w-[92%] max-w-md transition-all duration-300" style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, backdropFilter: `blur(${bgBlur}px)`, borderColor: currentTheme.glassBorder, borderWidth: '1px' }}>
          <div className="flex items-center justify-around py-2 px-3">
            {tabs.map(tab => {
              const Icon = tab.icon;
              const isActive = activeTab === tab.id;
              return (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{ backgroundColor: isActive ? currentTheme.primary : 'transparent', borderRadius: `${borderRadius - 8}px` }} className={`flex flex-col items-center gap-1 py-1.5 px-5 transition-all duration-300 ${isActive ? 'text-white shadow-lg scale-105 font-medium' : 'opacity-60 hover:opacity-100'}`}>
                  <Icon className="w-5 h-5" />
                  <span className="text-[11px]">{tab.label}</span>
                </button>
              );
            })}
          </div>
        </nav>
      );
    }

    // ==========================================
    // 9. МОДАЛЬНЫЕ ОКНА (ФОРМЫ И ИСТОРИЯ)
    // ==========================================
    function StudentFormModal({ student, onClose, onSave, currentTheme, borderRadius }) {
      const [formData, setFormData] = useState({
        name: student?.name || '',
        language: student?.language || 'English',
        totalLessons: student?.totalLessons || 10,
        startDate: student?.startDate || new Date().toISOString().slice(0, 10),
        endDate: student?.endDate || new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10),
        price: student?.price || 15000,
        duration: student?.duration || 60,
        color: student?.color || '#ec4899',
        notes: student?.notes || ''
      });

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="w-full max-w-lg border p-6 backdrop-blur-xl shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b border-white/10 pb-3">
              <h2 className="text-lg font-bold">{student ? 'Редактировать ученика' : 'Новый ученик и абонемент'}</h2>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10"><X className="w-5 h-5" /></button>
            </div>
            <form onSubmit={(e) => { e.preventDefault(); onSave(formData); }} className="space-y-4 text-xs">
              <div>
                <label className="block mb-1 opacity-80">ФИО Ученика *</label>
                <input type="text" required value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none" placeholder="Например: Алина Захарова" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block mb-1 opacity-80">Изучаемый язык</label>
                  <select value={formData.language} onChange={(e) => setFormData({ ...formData, language: e.target.value })} className="w-full p-2.5 bg-black/40 rounded-xl border border-white/20 focus:outline-none text-slate-100">
                    <option value="English">🇬🇧 English</option>
                    <option value="Arabic">🇸🇦 Arabic</option>
                  </select>
                </div>
                <div>
                  <label className="block mb-1 opacity-80">Кол-во занятий</label>
                  <input type="number" min="1" value={formData.totalLessons} onChange={(e) => setFormData({ ...formData, totalLessons: Number(e.target.value) })} className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block mb-1 opacity-80">Дата начала</label>
                  <input type="date" value={formData.startDate} onChange={(e) => setFormData({ ...formData, startDate: e.target.value })} className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none" />
                </div>
                <div>
                  <label className="block mb-1 opacity-80">Дата окончания</label>
                  <input type="date" value={formData.endDate} onChange={(e) => setFormData({ ...formData, endDate: e.target.value })} className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none" />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="block mb-1 opacity-80">Стоимость (руб)</label>
                  <input type="number" value={formData.price} onChange={(e) => setFormData({ ...formData, price: Number(e.target.value) })} className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none" />
                </div>
                <div>
                  <label className="block mb-1 opacity-80">Время (мин)</label>
                  <input type="number" value={formData.duration} onChange={(e) => setFormData({ ...formData, duration: Number(e.target.value) })} className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none" />
                </div>
                <div>
                  <label className="block mb-1 opacity-80">Цвет метки</label>
                  <input type="color" value={formData.color} onChange={(e) => setFormData({ ...formData, color: e.target.value })} className="w-full h-10 p-1 bg-white/10 rounded-xl border border-white/20 cursor-pointer" />
                </div>
              </div>

              <div>
                <label className="block mb-1 opacity-80">Примечание / Цель</label>
                <textarea rows="3" value={formData.notes} onChange={(e) => setFormData({ ...formData, notes: e.target.value })} className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none" placeholder="Уровень, программы, цели..." />
              </div>

              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="flex-1 py-2.5 bg-white/10 rounded-xl font-medium hover:bg-white/20">Отмена</button>
                <button type="submit" style={{ backgroundColor: currentTheme.primary }} className="flex-1 py-2.5 text-white rounded-xl font-medium shadow-lg hover:opacity-90">Сохранить</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function LessonConfirmationModal({ student, onClose, onConfirm, currentTheme, borderRadius }) {
      const [date, setDate] = useState(new Date().toISOString().slice(0, 16).replace('T', ' '));
      const [note, setNote] = useState('');

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="w-full max-w-sm border p-5 backdrop-blur-xl shadow-2xl space-y-4">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-base">Отметка о проведенном уроке</h3>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10"><X className="w-4 h-4" /></button>
            </div>
            <p className="text-xs opacity-80">Списать 1 занятие для ученика <strong>{student.name}</strong>?</p>
            <div className="space-y-3 text-xs">
              <div>
                <label className="block mb-1 opacity-80">Дата и время</label>
                <input type="text" value={date} onChange={(e) => setDate(e.target.value)} className="w-full p-2 bg-white/10 rounded-xl border border-white/20 focus:outline-none" />
              </div>
              <div>
                <label className="block mb-1 opacity-80">Тема урока / Заметка</label>
                <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Например: Грамматика Unit 4" className="w-full p-2 bg-white/10 rounded-xl border border-white/20 focus:outline-none" />
              </div>
            </div>
            <div className="flex gap-2 pt-2">
              <button onClick={onClose} className="flex-1 py-2 bg-white/10 rounded-xl text-xs font-medium">Отмена</button>
              <button onClick={() => onConfirm(date, note)} style={{ backgroundColor: currentTheme.primary }} className="flex-1 py-2 text-white rounded-xl text-xs font-medium shadow-md">Подтвердить</button>
            </div>
          </div>
        </div>
      );
    }

    function StudentHistoryModal({ student, onClose, onRevertLesson, onDeleteStudent, currentTheme, borderRadius }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="w-full max-w-md border p-5 backdrop-blur-xl shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
            <div className="flex justify-between items-center border-b border-white/10 pb-3">
              <div>
                <h3 className="font-bold text-base">{student.name}</h3>
                <p className="text-xs opacity-60">История всех проведенных занятий</p>
              </div>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10"><X className="w-5 h-5" /></button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2 text-xs pr-1 no-scrollbar">
              {!student.history || student.history.length === 0 ? (
                <div className="p-6 text-center opacity-50">Занятия еще не проводились</div>
              ) : (
                student.history.map((h) => (
                  <div key={h.id} className="p-3 bg-white/5 border border-white/10 rounded-xl flex justify-between items-center gap-2">
                    <div>
                      <div className="font-medium text-pink-300">{h.date}</div>
                      <div className="opacity-80 mt-0.5">{h.note}</div>
                    </div>
                    <button onClick={() => onRevertLesson(h.id)} className="p-1.5 text-xs text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-lg transition-all" title="Отменить списание">
                      <RotateCcw className="w-3.5 h-3.5" />
                    </button>
                  </div>
                ))
              )}
            </div>

            <div className="pt-2 border-t border-white/10 flex justify-between items-center">
              <button onClick={onDeleteStudent} className="px-3 py-1.5 bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl text-xs hover:bg-red-500/30 transition-all flex items-center gap-1">
                <Trash2 className="w-3.5 h-3.5" />
                <span>Удалить профиль</span>
              </button>
              <button onClick={onClose} className="px-4 py-1.5 bg-white/10 rounded-xl text-xs font-medium hover:bg-white/20">Закрыть</button>
            </div>
          </div>
        </div>
      );
    }

    function PwaInstallModal({ onClose, currentTheme, borderRadius }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fadeIn">
          <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="w-full max-w-md border p-6 backdrop-blur-xl shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b border-white/10 pb-3">
              <div className="flex items-center gap-2">
                <Smartphone className="w-5 h-5 text-pink-400" />
                <h3 className="font-bold text-base">Установка PWA на экран «Домой»</h3>
              </div>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10"><X className="w-5 h-5" /></button>
            </div>

            <div className="space-y-3 text-xs leading-relaxed opacity-90">
              <p className="font-semibold text-sm">Инструкция для iOS (Safari на iPhone / iPad):</p>
              <ol className="list-decimal list-inside space-y-2 bg-white/5 p-3 rounded-xl border border-white/10">
                <li>Откройте данный веб-сайт в браузере <strong>Safari</strong>.</li>
                <li>Нажмите системную кнопку <strong>«Поделиться»</strong> (иконка со стрелкой вверх <Share2 className="w-3.5 h-3.5 inline" />).</li>
                <li>Выберите пункт <strong>«На экран "Домой"»</strong> (Add to Home Screen).</li>
                <li>Нажмите <strong>«Добавить»</strong> в правом верхнем углу.</li>
              </ol>
            </div>

            <button onClick={onClose} style={{ backgroundColor: currentTheme.primary, borderRadius: `${borderRadius - 6}px` }} className="w-full py-2.5 text-white text-xs font-semibold shadow-md">
              Понятно
            </button>
          </div>
        </div>
      );
    }

    // Запуск приложения
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
