    // ==========================================
    // 2. HELPER UTILS & CALCULATIONS
    // ==========================================
    function getProgressColor(percent) {
      if (percent <= 20) return '#22c55e'; // Green
      if (percent <= 40) return '#84cc16'; // Light Green
      if (percent <= 60) return '#eab308'; // Yellow
      if (percent <= 80) return '#f97316'; // Orange
      if (percent < 100) return '#ef4444'; // Red-orange
      return '#dc2626'; // Pure Red
    }

    function getStudentStatus(student) {
      const remaining = student.totalLessons - student.completedLessons;
      const now = new Date();
      const endDate = new Date(student.endDate);
      
      if (remaining <= 0) return { label: 'Занятия закончились', color: 'bg-red-500/20 text-red-500 border-red-500/30' };
      if (endDate < now) return { label: 'Срок действия истёк', color: 'bg-red-500/20 text-red-400 border-red-500/30' };
      if (remaining === 1) return { label: 'Осталось 1 занятие!', color: 'bg-orange-500/20 text-orange-400 border-orange-500/30' };
      
      const diffTime = endDate - now;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      if (diffDays <= 3) return { label: 'Срок скоро истекает', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' };
      if (remaining <= 2) return { label: 'Мало занятий', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' };

      return { label: 'Активен', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' };
    }

      const handleConfirmLesson = (studentId, date, note) => {
        setStudents((prev) =>
          prev.map((s) => {
            if (s.id === studentId) {
              const completed = Math.min(s.totalLessons, s.completedLessons + 1);
              const newHistory = [
                { id: Date.now().toString(), date, note: note || 'Занятие проведено' },
                ...(s.history || [])
              ];
              return { ...s, completedLessons: completed, history: newHistory };
            }
            return s;
          })
        );
        setLessonModalStudent(null);
      };

      const handleRevertLesson = (studentId, historyItemId) => {
        setStudents((prev) =>
          prev.map((s) => {
            if (s.id === studentId) {
              const updatedHistory = (s.history || []).filter((h) => h.id !== historyItemId);
              const completed = Math.max(0, s.completedLessons - 1);
              return { ...s, completedLessons: completed, history: updatedHistory };
            }
            return s;
          })
        );
      };

      const handleSaveStudent = (formData) => {
        if (editingStudent) {
          setStudents((prev) =>
            prev.map((s) => (s.id === editingStudent.id ? { ...s, ...formData } : s))
          );
        } else {
          const newStudent = {
            id: Date.now().toString(),

            history: []
          };
          setStudents((prev) => [newStudent, ...prev]);
        }

        setEditingStudent(null);

      const filteredStudents = useMemo(() => {
        return students.filter((s) => {
          const matchesSearch =
            s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.notes.toLowerCase().includes(searchQuery.toLowerCase());

          if (!matchesSearch) return false;

          const remaining = s.totalLessons - s.completedLessons;
          const isExpired = new Date(s.endDate) < new Date();

          if (statusFilter === 'active') return remaining > 0 && !isExpired;
          if (statusFilter === 'ending') return remaining > 0 && remaining <= 2;
          if (statusFilter === 'expired') return isExpired || remaining === 0;
          if (statusFilter === 'english') return s.language === 'English';
          if (statusFilter === 'arabic') return s.language === 'Arabic';

      const stats = useMemo(() => {
        const total = students.length;
        const active = students.filter(
          (s) => s.totalLessons - s.completedLessons > 0 && new Date(s.endDate) >= new Date()
        ).length;
        const ending = students.filter((s) => {
          const rem = s.totalLessons - s.completedLessons;
          return rem > 0 && rem <= 2;
        }).length;

        return { total, active, ending };
      }, [students]);

        if (deviceMode === 'iphone') return 'max-w-[412px] mx-auto min-h-screen border-x border-white/10 shadow-2xl';

    // ==========================================
    // 4. MORNING GREETING COMPONENT
    // ==========================================
    function MorningGreeting({ animationsEnabled }) {
      const [visible, setVisible] = useState(false);
      const [fadingOut, setFadingOut] = useState(false);

      useEffect(() => {
        const checkGreeting = () => {
          const now = new Date();
          const hours = now.getHours();
          
          if (hours >= 6 && hours < 10) {
            const todayStr = now.toDateString();
            const lastShown = localStorage.getItem('dashulya_greeting_shown_date');

            if (lastShown !== todayStr) {
              setVisible(true);
              localStorage.setItem('dashulya_greeting_shown_date', todayStr);

              const fadeTimer = setTimeout(() => {
                setFadingOut(true);
                const removeTimer = setTimeout(() => {
                  setVisible(false);
                  setFadingOut(false);
                }, 1800);
                return () => clearTimeout(removeTimer);
              }, 10000);

              return () => clearTimeout(fadeTimer);
            }
          }
        };

        checkGreeting();
      }, []);

      if (!visible) return null;

      return (
        <div
          className={`pt-6 pb-2 px-6 flex justify-center transition-all duration-1000 transform ${
            fadingOut ? 'opacity-0 -translate-y-4' : 'opacity-100 translate-y-0'
          }`}
        >
          <div className="glass-panel px-6 py-3 rounded-full backdrop-blur-xl border border-white/20 shadow-xl flex items-center gap-3 bg-white/10">
            <span className="text-xl md:text-2xl font-medium tracking-wide">
              Доброе утро, Дашуля
            </span>
            <span
              className={`inline-block text-xl text-pink-400 ${
                animationsEnabled ? 'animate-bounce' : ''
              }`}
            >
              ❤️
            </span>
          </div>
        </div>
      );
    }

        <div

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 5 * 1024 * 1024) {
            alert('Файл слишком большой. Выберите фото до 5 МБ.');
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            setCustomBg(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleExportData = () => {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(students, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute('href', dataStr);
        downloadAnchor.setAttribute('download', `dashulya_tutor_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportData = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (Array.isArray(imported)) {
                setStudents(imported);
                alert('Данные успешно импортированы!');
              } else {
                alert('Неверный формат файла данных.');

              alert('Ошибка при чтении файла JSON.');
            }

          reader.readAsText(file);

                  placeholder="Например: Алина Захарова"

                  <label className="block mb-1 opacity-80">Изучаемый язык</label>

                    className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block mb-1 opacity-80">Дата окончания</label>

                  />
                </div>

                <div>
                  <label className="block mb-1 opacity-80">Длительность (мин)</label>
                  <input
                    type="number"
                    value={formData.duration}

                </div>

              <div>

            >

            </button>
          </div>
        </div>
      );
    }

    // Рендер приложения
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

    // Полный набор из 17 тем оформления
    const THEMES = [
      { id: 'spring', name: 'Spring Blossom', category: 'Сезонные', bg: 'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)', primary: '#ec4899', text: '#1f2937', card: 'rgba(255, 255, 255, 0.55)', icon: '🌸' },
      { id: 'midnight', name: 'Midnight Glass', category: 'Минимализм', bg: 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)', primary: '#38bdf8', text: '#f8fafc', card: 'rgba(15, 23, 42, 0.6)', icon: '🌙' },
      { id: 'autumn', name: 'Autumn Amber', category: 'Сезонные', bg: 'linear-gradient(135deg, #451a03 0%, #78350f 50%, #b45309 100%)', primary: '#f59e0b', text: '#fef3c7', card: 'rgba(69, 26, 3, 0.55)', icon: '🍂' },
      { id: 'winter', name: 'Winter Frost', category: 'Сезонные', bg: 'linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%)', primary: '#0284c7', text: '#0f172a', card: 'rgba(255, 255, 255, 0.7)', icon: '❄️' },
      { id: 'halloween', name: 'Halloween Night', category: 'Праздники', bg: 'linear-gradient(135deg, #180828 0%, #2e0854 50%, #581c87 100%)', primary: '#f97316', text: '#faf5ff', card: 'rgba(24, 8, 40, 0.65)', icon: '🎃' },
      { id: 'witch_night', name: 'Ведьминская ночь', category: 'Праздники', bg: 'linear-gradient(135deg, #050505 0%, #1a0033 50%, #330066 100%)', primary: '#c084fc', text: '#f3e8ff', card: 'rgba(10, 0, 20, 0.7)', icon: '🔮' },
      { id: 'new_year', name: 'Новый год', category: 'Праздники', bg: 'linear-gradient(135deg, #064e3b 0%, #022c22 50%, #7f1d1d 100%)', primary: '#fbbf24', text: '#ecfdf5', card: 'rgba(2, 44, 34, 0.65)', icon: '🎄' },
      { id: 'christmas', name: 'Рождество', category: 'Праздники', bg: 'linear-gradient(135deg, #991b1b 0%, #450a0a 100%)', primary: '#fef08a', text: '#fff1f2', card: 'rgba(69, 10, 10, 0.6)', icon: '🎁' },
      { id: 'valentines', name: 'День Святого Валентина', category: 'Праздники', bg: 'linear-gradient(135deg, #be123c 0%, #881337 50%, #4c0519 100%)', primary: '#fb7185', text: '#fff1f2', card: 'rgba(76, 5, 25, 0.65)', icon: '💖' },
      { id: 'birthday', name: 'День рождения', category: 'Праздники', bg: 'linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #f43f5e 100%)', primary: '#fef08a', text: '#ffffff', card: 'rgba(139, 92, 246, 0.45)', icon: '🎂' },
      { id: 'flower_garden', name: 'Цветочный сад', category: 'Природа', bg: 'linear-gradient(135deg, #d9f99d 0%, #4ade80 50%, #059669 100%)', primary: '#047857', text: '#064e3b', card: 'rgba(255, 255, 255, 0.55)', icon: '🌺' },
      { id: 'space', name: 'Космос', category: 'Минимализм', bg: 'linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%)', primary: '#818cf8', text: '#f8fafc', card: 'rgba(2, 6, 23, 0.75)', icon: '🚀' },
      { id: 'night_city', name: 'Ночной город', category: 'Минимализм', bg: 'linear-gradient(135deg, #111827 0%, #1f2937 50%, #374151 100%)', primary: '#f59e0b', text: '#f9fafb', card: 'rgba(17, 24, 39, 0.7)', icon: '🏙️' },
      { id: 'ocean', name: 'Морская тема', category: 'Природа', bg: 'linear-gradient(135deg, #0f766e 0%, #0e7490 50%, #0369a1 100%)', primary: '#67e8f9', text: '#f0fdf4', card: 'rgba(15, 118, 110, 0.5)', icon: '🌊' },
      { id: 'light_minimal', name: 'Светлый минимализм', category: 'Минимализм', bg: 'linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)', primary: '#2563eb', text: '#0f172a', card: 'rgba(255, 255, 255, 0.85)', icon: '☀️' },
      { id: 'gold_luxury', name: 'Графитово-золотая', category: 'Премиум', bg: 'linear-gradient(135deg, #18181b 0%, #27272a 50%, #09090b 100%)', primary: '#eab308', text: '#fafafa', card: 'rgba(24, 24, 27, 0.75)', icon: '👑' },
      { id: 'summer', name: 'Лето', category: 'Сезонные', bg: 'linear-gradient(135deg, #fde047 0%, #f97316 100%)', primary: '#ea580c', text: '#431407', card: 'rgba(255, 255, 255, 0.6)', icon: '☀️' }
    ];

    const INITIAL_STUDENTS = [
      { id: '1', name: 'Алина Захарова', language: 'English', totalLessons: 10, completedLessons: 8, color: '#ec4899', endDate: '2026-11-12' },
      { id: '2', name: 'Мухаммад Аль-Мансур', language: 'Arabic', totalLessons: 10, completedLessons: 5, color: '#38bdf8', endDate: '2026-11-01' },
      { id: '3', name: 'Илья Мельников', language: 'English', totalLessons: 10, completedLessons: 9, color: '#10b981', endDate: '2026-10-20' }
    ];

    const todayObj = new Date();
    const curYear = todayObj.getFullYear();
    const curMonth = String(todayObj.getMonth() + 1).padStart(2, '0');
    const curDay = String(todayObj.getDate()).padStart(2, '0');
    const todayStr = `${curYear}-${curMonth}-${curDay}`;

    const INITIAL_LESSONS = [
      { id: 'l1', studentId: '1', date: todayStr, time: '11:00', topic: 'Present Perfect' },
      { id: 'l2', studentId: '2', date: todayStr, time: '14:00', topic: 'Египетский диалект' },
      { id: 'l3', studentId: '3', date: todayStr, time: '16:30', topic: 'IELTS Writing' }
    ];

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('dashulya_auth') === 'true');
      const [email, setEmail] = useState('tutor@dashulya.ru');
      const [password, setPassword] = useState('••••••••');
      const [authError, setAuthError] = useState('');

      const [activeTab, setActiveTab] = useState('main'); // 'main' | 'calendar' | 'settings'
      const [students, setStudents] = useState(() => JSON.parse(localStorage.getItem('dashulya_students') || JSON.stringify(INITIAL_STUDENTS)));
      const [lessons, setLessons] = useState(() => JSON.parse(localStorage.getItem('dashulya_lessons') || JSON.stringify(INITIAL_LESSONS)));
      const [currentThemeId, setCurrentThemeId] = useState(() => localStorage.getItem('dashulya_theme') || 'spring');

      // Модалки
      const [modalDate, setModalDate] = useState(null);
      const [newStudentId, setNewStudentId] = useState(INITIAL_STUDENTS[0].id);
      const [newTime, setNewTime] = useState('12:00');
      const [newTopic, setNewTopic] = useState('');

      const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);
      const [stName, setStName] = useState('');
      const [stLang, setStLang] = useState('English');
      const [stColor, setStColor] = useState('#ec4899');
      const [stTotal, setStTotal] = useState(10);

      const currentTheme = useMemo(() => THEMES.find(t => t.id === currentThemeId) || THEMES[0], [currentThemeId]);

      useEffect(() => {
        localStorage.setItem('dashulya_auth', isLoggedIn);
        localStorage.setItem('dashulya_students', JSON.stringify(students));
        localStorage.setItem('dashulya_lessons', JSON.stringify(lessons));
        localStorage.setItem('dashulya_theme', currentThemeId);
      }, [isLoggedIn, students, lessons, currentThemeId]);

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 text-slate-100">
            <div className="w-full max-w-md p-8 rounded-3xl bg-white/10 backdrop-blur-2xl border border-white/20 shadow-2xl space-y-6 animate-fadeIn">
              <div className="text-center space-y-2">
                <div className="inline-flex p-3 rounded-2xl bg-pink-500/20 text-pink-400 border border-pink-500/30">
                  <IconUser />
                </div>
                <h1 className="text-2xl font-bold">Дашуля Tutor</h1>
                <p className="text-xs text-slate-400">Вход в личный кабинет преподавателя</p>
              </div>

              {authError && <div className="p-3 bg-red-500/20 border border-red-500/30 text-red-300 text-xs rounded-xl">{authError}</div>}

              <form onSubmit={(e) => {
                e.preventDefault();
                if (!email || password.length < 4) {
                  setAuthError('Введите корректный email и пароль');
                  return;
                }
                setIsLoggedIn(true);
              }} className="space-y-4 text-xs">
                <div>
                  <label className="block mb-1 text-slate-300">Электронная почта</label>
                  <div className="relative">
                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IconMail /></span>
                    <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full pl-10 pr-4 py-3 bg-black/40 rounded-xl border border-white/10 text-slate-100 focus:outline-none focus:border-pink-500" />
                  </div>
                </div>

                <div>
                  <label className="block mb-1 text-slate-300">Пароль</label>
                  <div className="relative">
                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IconLock /></span>
                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full pl-10 pr-4 py-3 bg-black/40 rounded-xl border border-white/10 text-slate-100 focus:outline-none focus:border-pink-500" />
                  </div>
                </div>

                <button type="submit" className="w-full py-3 bg-pink-600 hover:bg-pink-500 text-white font-semibold rounded-xl shadow-lg transition-all">
                  Войти в систему
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-28 transition-colors duration-500" style={{ background: currentTheme.bg, color: currentTheme.text }}>
          <div className="max-w-xl mx-auto p-4 md:p-6 space-y-6">

            {/* ВКЛАДКА: ГЛАВНАЯ */}
            {activeTab === 'main' && (
              <div className="space-y-4 animate-fadeIn">
                <div className="flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-bold">Привет, Дашуля! ❤️</h1>
                    <p className="text-xs opacity-75">Управление учениками и абонементами</p>
                  </div>
                  <button onClick={() => setIsStudentModalOpen(true)} className="px-3.5 py-2 rounded-xl bg-pink-600 text-white text-xs font-semibold shadow-md flex items-center gap-1.5 hover:bg-pink-500">
                    <IconPlus /> Добавить
                  </button>
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <div className="p-3.5 rounded-2xl border border-white/20 backdrop-blur-md shadow-md" style={{ backgroundColor: currentTheme.card }}>
                    <div className="text-[11px] opacity-75">Всего учеников</div>
                    <div className="text-xl font-bold mt-1">{students.length}</div>
                  </div>
                  <div className="p-3.5 rounded-2xl border border-white/20 backdrop-blur-md shadow-md" style={{ backgroundColor: currentTheme.card }}>
                    <div className="text-[11px] opacity-75">Активные</div>
                    <div className="text-xl font-bold mt-1 text-emerald-400">{students.filter(s => s.completedLessons < s.totalLessons).length}</div>
                  </div>
                  <div className="p-3.5 rounded-2xl border border-white/20 backdrop-blur-md shadow-md" style={{ backgroundColor: currentTheme.card }}>
                    <div className="text-[11px] opacity-75">Уроков всего</div>
                    <div className="text-xl font-bold mt-1">{lessons.length}</div>
                  </div>
                </div>

                <div className="space-y-3 pt-2">
                  <h2 className="text-sm font-bold opacity-90">Ваши ученики</h2>
                  {students.map((st) => {
                    const percent = Math.round((st.completedLessons / st.totalLessons) * 100);
                    return (
                      <div key={st.id} className="p-4 rounded-2xl border border-white/20 backdrop-blur-md relative overflow-hidden space-y-2 shadow-lg" style={{ backgroundColor: currentTheme.card }}>
                        <div className="absolute top-0 left-0 w-1.5 h-full" style={{ backgroundColor: st.color }} />
                        <div className="flex justify-between items-center">
                          <div className="flex items-center gap-2">
                            <h3 className="font-bold text-sm">{st.name}</h3>
                            <span className="text-[10px] px-2 py-0.5 rounded-full bg-white/20 border border-white/20">{st.language}</span>
                          </div>
                          <button onClick={() => setStudents(students.filter(s => s.id !== st.id))} className="text-red-400 hover:opacity-100 opacity-60 text-xs">Удалить</button>
                        </div>
                        <div className="space-y-1">
                          <div className="flex justify-between text-xs opacity-80">
                            <span>Проведено: {st.completedLessons} из {st.totalLessons}</span>
                            <span>{percent}%</span>
                          </div>
                          <div className="w-full h-2 bg-black/20 rounded-full overflow-hidden">
                            <div className="h-full rounded-full transition-all" style={{ width: `${percent}%`, backgroundColor: st.color }} />
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ВКЛАДКА: КАЛЕНДАРЬ */}
            {activeTab === 'calendar' && (
              <div className="space-y-4 animate-fadeIn">
                <div className="p-4 rounded-2xl border border-white/20 backdrop-blur-md flex justify-between items-center shadow-lg" style={{ backgroundColor: currentTheme.card }}>
                  <h2 className="text-sm font-bold">Календарь занятий ({curYear} год)</h2>
                  <span className="text-xs opacity-75">Нажмите на день для добавления урока</span>
                </div>

                <div className="grid grid-cols-7 gap-1 text-center text-xs font-bold opacity-75">
                  {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => <div key={d} className="py-1">{d}</div>)}
                </div>

                <div className="grid grid-cols-7 gap-1.5">
                  {Array.from({ length: 31 }, (_, i) => {
                    const dNum = i + 1;
                    const dStr = `${curYear}-${curMonth}-${String(dNum).padStart(2, '0')}`;
                    const dayLessons = lessons.filter(l => l.date === dStr);

                    return (
                      <div
                        key={dStr}
                        onClick={() => setModalDate(dStr)}
                        className="min-h-[85px] p-1.5 rounded-xl border border-white/20 bg-white/10 backdrop-blur-md hover:border-pink-500 cursor-pointer flex flex-col justify-between overflow-hidden shadow"
                      >
                        <span className="text-xs font-semibold">{dNum}</span>
                        
                        <div className="space-y-1 overflow-y-auto max-h-[55px] no-scrollbar">
                          {dayLessons.map(l => {
                            const st = students.find(s => s.id === l.studentId);
                            return (
                              <div
                                key={l.id}
                                style={{ backgroundColor: st?.color || '#ec4899' }}
                                className="px-1.5 py-0.5 rounded text-[9px] font-semibold text-white truncate shadow-sm flex justify-between"
                                title={`${l.time} — ${st?.name}`}
                              >
                                <span>{l.time}</span>
                                <span className="truncate ml-1">{st?.name.split(' ')[0]}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ВКЛАДКА: НАСТРОЙКИ */}
            {activeTab === 'settings' && (
              <div className="space-y-4 animate-fadeIn">
                <div className="p-4 rounded-2xl border border-white/20 backdrop-blur-md" style={{ backgroundColor: currentTheme.card }}>
                  <h1 className="text-xl font-bold">Настройки</h1>
                  <p className="text-xs opacity-75">Персонализация приложения</p>
                </div>

                <div className="p-5 rounded-2xl border border-white/20 backdrop-blur-md space-y-3 shadow-lg" style={{ backgroundColor: currentTheme.card }}>
                  <h3 className="text-sm font-bold">Коллекция тем оформления (17 пресетов)</h3>
                  <div className="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto pr-1">
                    {THEMES.map(t => (
                      <button
                        key={t.id}
                        onClick={() => setCurrentThemeId(t.id)}
                        className={`p-3 rounded-xl text-left border text-xs font-medium transition-all ${currentThemeId === t.id ? 'ring-2 ring-white border-white' : 'border-white/20 opacity-80'}`}
                        style={{ background: t.bg }}
                      >
                        <div className="text-xl">{t.icon}</div>
                        <div className="text-white drop-shadow mt-1">{t.name}</div>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="p-5 rounded-2xl border border-white/20 backdrop-blur-md space-y-3 shadow-lg" style={{ backgroundColor: currentTheme.card }}>
                  <h3 className="text-sm font-bold">Личный кабинет</h3>
                  <p className="text-xs opacity-75">Вы вошли как: <strong>{email}</strong></p>
                  <button
                    onClick={() => setIsLoggedIn(false)}
                    className="w-full py-3 bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-red-300 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all shadow"
                  >
                    <IconLogout /> Выйти из личного кабинета
                  </button>
                </div>
              </div>
            )}

          </div>

          {/* МОДАЛКА: ДОБАВИТЬ УРОК */}
          {modalDate && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fadeIn">
              <div className="w-full max-w-sm bg-slate-900 border border-white/20 p-6 rounded-3xl space-y-4 shadow-2xl text-xs text-slate-100">
                <div className="flex justify-between items-center border-b border-white/10 pb-2">
                  <h3 className="text-sm font-bold">Добавить урок на {modalDate}</h3>
                  <button onClick={() => setModalDate(null)} className="p-1 hover:bg-white/10 rounded-full"><IconX /></button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const newLesson = { id: Date.now().toString(), studentId: newStudentId, date: modalDate, time: newTime, topic: newTopic };
                  setLessons([...lessons, newLesson]);
                  setModalDate(null);
                  setNewTopic('');
                }} className="space-y-3">
                  <div>
                    <label className="block mb-1 text-slate-400">Ученик</label>
                    <select value={newStudentId} onChange={e => setNewStudentId(e.target.value)} className="w-full p-2.5 bg-black/40 rounded-xl border border-white/10 text-slate-100">
                      {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.language})</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block mb-1 text-slate-400">Время</label>
                    <input type="time" value={newTime} onChange={e => setNewTime(e.target.value)} className="w-full p-2.5 bg-black/40 rounded-xl border border-white/10 text-slate-100" />
                  </div>

                  <div>
                    <label className="block mb-1 text-slate-400">Тема урока</label>
                    <input type="text" placeholder="Например: Грамматика" value={newTopic} onChange={e => setNewTopic(e.target.value)} className="w-full p-2.5 bg-black/40 rounded-xl border border-white/10 text-slate-100" />
                  </div>

                  <button type="submit" className="w-full py-3 bg-pink-600 hover:bg-pink-500 font-semibold text-white rounded-xl shadow-lg mt-2">
                    Сохранить занятие
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* МОДАЛКА: ДОБАВИТЬ УЧЕНИКА */}
          {isStudentModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fadeIn">
              <div className="w-full max-w-sm bg-slate-900 border border-white/20 p-6 rounded-3xl space-y-4 shadow-2xl text-xs text-slate-100">
                <div className="flex justify-between items-center border-b border-white/10 pb-2">
                  <h3 className="text-sm font-bold">Новый ученик</h3>
                  <button onClick={() => setIsStudentModalOpen(false)} className="p-1 hover:bg-white/10 rounded-full"><IconX /></button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (!stName) return;
                  const newSt = { id: Date.now().toString(), name: stName, language: stLang, totalLessons: Number(stTotal), completedLessons: 0, color: stColor, endDate: '2026-12-01' };
                  setStudents([...students, newSt]);
                  setIsStudentModalOpen(false);
                  setStName('');
                }} className="space-y-3">
                  <div>
                    <label className="block mb-1 text-slate-400">Имя ученика</label>
                    <input type="text" required placeholder="ФИО..." value={stName} onChange={e => setStName(e.target.value)} className="w-full p-2.5 bg-black/40 rounded-xl border border-white/10 text-slate-100" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block mb-1 text-slate-400">Язык</label>
                      <select value={stLang} onChange={e => setStLang(e.target.value)} className="w-full p-2.5 bg-black/40 rounded-xl border border-white/10 text-slate-100">
                        <option value="English">English</option>
                        <option value="Arabic">Arabic</option>
                      </select>
                    </div>
                    <div>
                      <label className="block mb-1 text-slate-400">Цвет в календаре</label>
                      <input type="color" value={stColor} onChange={e => setStColor(e.target.value)} className="w-full h-10 p-1 bg-black/40 rounded-xl border border-white/10 cursor-pointer" />
                    </div>
                  </div>

                  <div>
                    <label className="block mb-1 text-slate-400">Количество занятий</label>
                    <input type="number" min="1" value={stTotal} onChange={e => setStTotal(e.target.value)} className="w-full p-2.5 bg-black/40 rounded-xl border border-white/10 text-slate-100" />
                  </div>

                  <button type="submit" className="w-full py-3 bg-pink-600 hover:bg-pink-500 font-semibold text-white rounded-xl shadow-lg mt-2">
                    Добавить ученика
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ */}
          <nav className="fixed bottom-3 left-1/2 -translate-x-1/2 z-40 w-[92%] max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl p-1.5">
            <div className="flex items-center justify-around">
              {[
                { id: 'main', label: 'Главная', icon: <IconHome /> },
                { id: 'calendar', label: 'Календарь', icon: <IconCalendar /> },
                { id: 'settings', label: 'Настройки', icon: <IconSettings /> }
              ].map((tab) => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center gap-1 py-2 px-6 rounded-xl transition-all duration-300 ${isActive ? 'bg-pink-600 text-white shadow-lg shadow-pink-600/30 scale-105' : 'opacity-75 hover:opacity-100'}`}
                  >
                    {tab.icon}
                    <span className="text-[10px] font-medium">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
